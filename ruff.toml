# Static gate for the class of bug that made this package fragile: names that
# arrived via `from .lctims import *` rather than an explicit import.
#
# `plot_chromatograms_mobilograms.py` used `os.path`/`os.makedirs` without ever
# importing `os`, and `mobility_analysis.py` used `np`/`pd` the same way. Those
# resolve at call time, not import time, so they pass a smoke test and fail on
# the user's third click. F403/F405/F821 make that impossible to reintroduce.

target-version = "py310"
line-length = 100

[lint]
select = ["F", "E4", "E7", "E9", "I"]

[lint.per-file-ignores]
# Re-exports are the whole point of a package __init__.
"__init__.py" = ["F401"]
