[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LCTIMSpy"
version = "0.1.0"
description = "Processing and analysis of TIMSTOF LC-TIMS-MS data, for identifying isomerized residues in peptides acquired by LC-CID-TIMS"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Samuel Okyem", email = "okyemsamuel@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Deliberately does NOT include pyTDFSDK. The Bruker SDK is a native,
# platform-specific dependency (timsdata.dll / libtimsdata.so, no macOS build),
# and the package must remain importable and testable without it.
# Install it with:  pip install -e .[bruker]
dependencies = [
    "pandas>=1.0",
    "numpy>=1.18",
    "matplotlib>=3.1",
    "seaborn",
    "scipy",
    "plotly",
    "pyteomics",
    "statsmodels",
    "statannotations",
    "pyarrow>=14",
    "platformdirs",
    # mzML / mzIdentML parsing (pyteomics needs both for PSI formats)
    "lxml>=5",
    "psims>=1.3",
]

[project.scripts]
lctimspy = "LCTIMSpy.cli:main"

# Windowed launcher: no console window on Windows.
[project.gui-scripts]
lctimspy-desktop = "LCTIMSpy.desktop.main:main"

[project.optional-dependencies]
bruker = ["pyTDFSDK @ git+https://github.com/gtluu/pyTDFSDK.git"]
server = ["fastapi", "uvicorn[standard]", "pydantic>=2"]
desktop = ["fastapi", "uvicorn[standard]", "pydantic>=2", "pywebview>=5"]
dev = ["ruff", "pytest", "pytest-cov", "httpx"]
build = ["pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/sokyem/LCTIMSpy"

[tool.setuptools.packages.find]
include = ["LCTIMSpy*"]

# The built web UI (web/ -> npm run build) is committed and shipped in the
# wheel, so `pip install` gives a working `lctimspy serve` with no Node.
[tool.setuptools.package-data]
LCTIMSpy = ["server/static/*", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
